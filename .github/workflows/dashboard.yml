name: Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */2 * * *"
  push:
    paths:
      - ".github/workflows/dashboard.yml"
      - "src/automations/cashconverters/dashboard.py"
      - "scripts/generate_dashboard.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: storage/automation.db
          key: dashboard-${{ github.run_id }}
          restore-keys: cashconverters-state-
      - run: pip install .
      - run: python scripts/generate_dashboard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
