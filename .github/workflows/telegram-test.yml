name: Telegram notification test
# Editing this workflow intentionally triggers one real smoke test.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Send test notification
        run: python scripts/test_telegram.py
