scan:
  interval_minutes: 15
  pages_per_source: 2
  detail_requests_limit: 5
  tracked_items_limit: 100
  refresh_minutes: 120
  full_scan_minutes: 1440
  minimum_products: 10
  sudden_drop_ratio: 0.25

# V2: all desktop PCs, not keyword searches (which mix PCs and components).
sources:
  - name: desktops
    url: "https://www.cashconverters.be/fr/164-ordinateurs-de-bureau?order=product.date_add.desc"

# Checked independently on every scan, including during desktop catalogue outages.
watch:
  title: "RTX 3090 Ti MSI 24 Go"
  url: "https://www.cashconverters.be/fr/accessoires-informatique/1278034-carte-graphique-msi-rtx-3090-ti-24gb.html"
