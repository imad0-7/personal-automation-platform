scan:
  interval_minutes: 15
  pages_per_source: 2
  detail_requests_limit: 5
  tracked_items_limit: 100
  refresh_minutes: 120
  full_scan_minutes: 1440
  minimum_products: 10
  sudden_drop_ratio: 0.25

# V2: all desktop PCs, not keyword searches (which mix PCs and components).
sources:
  - name: desktops
    url: "https://www.cashconverters.be/fr/164-ordinateurs-de-bureau?order=product.date_add.desc"

# Standalone GPUs only; desktop PCs keep their own existing feed and rules.
gpus:
  enabled: true
  models: [3070, 3080, 3090, 4060, 4070, 4080, 4090, 5060, 5070, 5080, 5090]
  sources:
    - name: gpu-rtx
      url: "https://www.cashconverters.be/fr/recherche?controller=search&s=rtx&order=product.date_add.desc"
    - name: gpu-cards
      url: "https://www.cashconverters.be/fr/recherche?controller=search&s=carte+graphique&order=product.date_add.desc"
